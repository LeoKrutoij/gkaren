<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гкарен</title>
    <link id="favicon-link" rel="icon" type="image/png" href="favicon.png">

    <!-- Open Graph для Discord, Telegram, VK и др. -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gkaren.com/">
    <meta property="og:title" content="Гкарен">
    <meta property="og:description" content="забавный сайт про самого влиятельного игрока в геометри дэш гкарен">
    <meta property="og:image" content="https://gkaren.com/favicon.png">
    <meta property="og:image:width" content="256">
    <meta property="og:image:height" content="256">
    <meta property="og:site_name" content="gkaren.com">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Гкарен">
    <meta name="twitter:description" content="забавный сайт про самого влиятельного игрока в геометри дэш гкарен">
    <meta name="twitter:image" content="https://gkaren.com/favicon.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            transition: background 0.5s;
        }
        body {
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: color 0.5s;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 12px 20px;
            background: #111;
            border-bottom: 1px solid #222;
            flex-wrap: wrap;
            transition: background 0.5s, border-color 0.5s;
        }
        nav .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.2em;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s;
        }
        nav .brand img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: block;
            transition: filter 0.3s;
        }
        nav .tabs {
            display: flex;
            gap: 6px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        nav .tab {
            background: transparent;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: 0.2s;
        }
        nav .tab:hover { background: #1a1a1a; color: #fff; }
        nav .tab.active { background: #fff; color: #000; border-color: #fff; }

        /* КНОПКА DISCORD */
        nav .discord-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #5865F2;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95em;
            font-weight: bold;
            transition: 0.2s;
        }
        nav .discord-btn:hover { background: #4752c4; }

        /* СТРАНИЦЫ */
        .page { display: none; padding: 20px 10px; }
        .page.active { display: block; }

        /* ГЛАВНАЯ */
        .home-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .home-video {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 12px;
            display: block;
            background: #000;
        }
        .quality-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #aaa;
            font-size: 0.95em;
            cursor: pointer;
            user-select: none;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #333;
            border-radius: 24px;
            transition: 0.3s;
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        .switch input:checked + .slider { background: #4caf50; }
        .switch input:checked + .slider:before { transform: translateX(22px); }

        /* РАЗДЕЛИТЕЛЬ */
        .divider {
            width: 80%;
            max-width: 900px;
            height: 1px;
            background: #333;
            margin: 30px auto;
        }

        /* ЗАГОЛОВКИ РАЗДЕЛОВ */
        .section-title {
            font-size: 1.6em;
            font-weight: bold;
            color: #fff;
            text-align: center;
            margin: 20px 0 10px;
        }

        /* YOUTUBE-БЛОК */
        .yt-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        .yt-block iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 12px;
            display: block;
        }

        /* ЛЕНТА */
        .feed {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .feed img, .feed video {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 10px;
            display: block;
        }
        .empty {
            color: #666;
            font-size: 1.1em;
            margin-top: 40px;
            text-align: center;
            width: 100%;
        }

        /* ФИНАЛЬНАЯ КАРТИНКА ВНИЗУ */
        .footer-img {
            width: 100%;
            height: 30vh;
            object-fit: fill;
            display: block;
            margin-top: 40px;
            user-select: none;
            pointer-events: none;
        }

        /* ====== ДЬЯВОЛЬСКИЙ РЕЖИМ ====== */
        body.devil-mode {
            background: radial-gradient(circle at top, #3a0000 0%, #000 70%);
            color: #ff4444;
        }
        body.devil-mode nav {
            background: #1a0000;
            border-bottom: 1px solid #660000;
        }
        body.devil-mode nav .brand {
            color: #ff2222;
        }
        body.devil-mode nav .tab {
            border-color: #660000;
            color: #ff8888;
        }
        body.devil-mode nav .tab:hover {
            background: #2a0000;
            color: #ffcccc;
        }
        body.devil-mode nav .tab.active {
            background: #ff2222;
            color: #000;
            border-color: #ff2222;
        }
        body.devil-mode .quality-toggle { color: #ff6666; }
        body.devil-mode .empty { color: #883333; }
        body.devil-mode .footer-img {
            filter: hue-rotate(-30deg) saturate(2) brightness(0.8);
        }
        body.devil-mode .divider {
            background: #660000;
        }
        body.devil-mode .section-title {
            color: #ff2222;
        }
    </style>
</head>
<body>

<nav>
    <a class="brand" id="brand-logo">
        <img id="brand-img" src="favicon.png" alt="logo">
        <span id="brand-text">gkaren.com</span>
    </a>
    <div class="tabs">
        <button class="tab active" data-page="home">Главная</button>
        <button class="tab" data-page="images">Фото</button>
        <button class="tab" data-page="gifs">Гифки</button>
        <button class="tab" data-page="videos">Видео</button>
        <button class="tab" data-page="memes">Мемы</button>
    </div>
    <a class="discord-btn"
       id="discord-link"
       href="https://discord.gg/bombom"
       target="_blank"
       rel="noopener noreferrer">
        💬 Discord
    </a>
</nav>

<!-- ГЛАВНАЯ -->
<section class="page active" id="page-home">
    <div class="home-wrap">

        <!-- ВИДЕО С 4K ТУМБЛЕРОМ -->
        <video id="home-video" class="home-video"
               autoplay muted loop playsinline controls
               src="content/gkarenteaser.mp4"></video>
        <label class="quality-toggle">
            <span>4K качество</span>
            <span class="switch">
                <input type="checkbox" id="quality-toggle">
                <span class="slider"></span>
            </span>
        </label>

        <!-- РАЗДЕЛИТЕЛЬ -->
        <div class="divider"></div>

        <!-- КТО ТАКОЙ ГКАРЕН -->
        <h2 class="section-title">Кто такой Гкарен?</h2>
        <div class="yt-block">
            <iframe
                src="https://www.youtube.com/embed/VPiMgd9SShI"
                title="Кто такой Гкарен"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
        </div>

        <!-- РАЗДЕЛИТЕЛЬ -->
        <div class="divider"></div>

        <!-- ВИДЕО ГКАРЕНА -->
        <h2 class="section-title">Видео Гкарена</h2>
        <div class="yt-block">
            <iframe
                src="https://www.youtube.com/embed/Kb-CfA-b9ds"
                title="Видео Гкарена 1"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
            <iframe
                src="https://www.youtube.com/embed/xs15PaOr0y4"
                title="Видео Гкарена 2"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
        </div>

    </div>
</section>

<!-- ФОТО -->
<section class="page" id="page-images">
    <div class="feed" id="feed-images"></div>
</section>

<!-- ГИФКИ -->
<section class="page" id="page-gifs">
    <div class="feed" id="feed-gifs"></div>
</section>

<!-- ВИДЕО -->
<section class="page" id="page-videos">
    <div class="feed" id="feed-videos"></div>
</section>

<!-- МЕМЫ -->
<section class="page" id="page-memes">
    <div class="feed" id="feed-memes"></div>
</section>

<!-- ФИНАЛЬНАЯ КАРТИНКА -->
<img src="content/timudakatheend.jpg" alt="the end" class="footer-img">

<script>
    // ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
    document.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById("page-" + btn.dataset.page).classList.add("active");
            window.scrollTo({ top: 0 });
        });
    });

    // ТУМБЛЕР 4K
    const homeVideo = document.getElementById("home-video");
    const qualityToggle = document.getElementById("quality-toggle");
    qualityToggle.addEventListener("change", () => {
        homeVideo.src = qualityToggle.checked
            ? "content/gkarenteaser4K.mp4"
            : "content/gkarenteaser.mp4";
        homeVideo.load();
        homeVideo.play().catch(() => {});
    });

    // SFX ПРИ ПЕРЕХОДЕ В DISCORD
    const sfx = new Audio("sfx/gigamegateam.mp3");
    sfx.preload = "auto";
    sfx.volume = 0.7;

    document.getElementById("discord-link").addEventListener("click", () => {
        try {
            sfx.pause();
            sfx.currentTime = 0;
            sfx.play().catch(() => {});
        } catch (e) {}
    });

    // ОСТАНОВКА ЗВУКА ПРИ ВОЗВРАЩЕНИИ НА САЙТ
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
            try {
                sfx.pause();
                sfx.currentTime = 0;
            } catch (e) {}
        }
    });

    // ====== ПАСХАЛКА: 10 КЛИКОВ ПО ЛОГОТИПУ ======
    const brandLogo = document.getElementById("brand-logo");
    const brandImg = document.getElementById("brand-img");
    const brandText = document.getElementById("brand-text");
    const faviconLink = document.getElementById("favicon-link");
    const devilSound = new Audio("sfx/gkarendyavoldrop.mp3");
    devilSound.preload = "auto";
    devilSound.volume = 0.8;

    const NORMAL_IMG = "favicon.png";
    const DEVIL_IMG  = "content/favicondyavol.png";
    const NORMAL_TEXT = "gkaren.com";
    const DEVIL_TEXT  = "Гкарен дьявол!!!";

    let clickCount = 0;
    let devilMode = false;

    brandLogo.addEventListener("click", (e) => {
        e.preventDefault();
        clickCount++;

        if (clickCount >= 10) {
            clickCount = 0;
            devilMode = !devilMode;

            if (devilMode) {
                document.body.classList.add("devil-mode");
                document.title = "Гкарен дьявол!!!";
                brandImg.src = DEVIL_IMG;
                brandText.textContent = DEVIL_TEXT;
                faviconLink.href = DEVIL_IMG;
                devilSound.currentTime = 0;
                devilSound.play().catch(() => {});
            } else {
                document.body.classList.remove("devil-mode");
                document.title = "Гкарен";
                brandImg.src = NORMAL_IMG;
                brandText.textContent = NORMAL_TEXT;
                faviconLink.href = NORMAL_IMG;
                devilSound.pause();
                devilSound.currentTime = 0;
            }
        }
    });

    // ОТРИСОВКА ЛЕНТ
    function renderImages(containerId, items) {
        const feed = document.getElementById(containerId);
        if (!items || items.length === 0) {
            feed.innerHTML = '<p class="empty">Пока пусто</p>';
            return;
        }
        items.forEach(src => {
            const el = document.createElement("img");
            el.src = src;
            el.alt = "гкарен";
            el.loading = "lazy";
            feed.appendChild(el);
        });
    }

    function renderVideos(containerId, items) {
        const feed = document.getElementById(containerId);
        if (!items || items.length === 0) {
            feed.innerHTML = '<p class="empty">Пока пусто</p>';
            return;
        }
        items.forEach(src => {
            const el = document.createElement("video");
            el.src = src;
            el.controls = true;
            el.preload = "metadata";
            feed.appendChild(el);
        });
    }

    fetch("files.json")
        .then(res => res.json())
        .then(data => {
            renderImages("feed-images", data.images || []);
            renderImages("feed-gifs", data.gifs || []);
            renderVideos("feed-videos", data.videos || []);
            renderImages("feed-memes", data.memes || []);
        })
        .catch(err => {
            const msg = '<p class="empty">Ошибка загрузки files.json</p>';
            document.getElementById("feed-images").innerHTML = msg;
            document.getElementById("feed-gifs").innerHTML = msg;
            document.getElementById("feed-videos").innerHTML = msg;
            document.getElementById("feed-memes").innerHTML = msg;
            console.error(err);
        });
</script>

</body>
</html>
